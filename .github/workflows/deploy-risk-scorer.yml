name: Deploy Risk Scorer to Azure

on:
  push:
    branches: [ main, master ]
    paths:
      - 'risk-scorer/**'

env:
  AZURE_WEBAPP_NAME: risk-scorer-gg
  AZURE_WEBAPP_URL: https://risk-scorer-gg.azurewebsites.net

jobs:
  deploy:
    name: Build & Deploy Risk Scorer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kodu
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Risk Scorer JAR
        run: mvn -f risk-scorer/pom.xml package -DskipTests

      - name: Deploy na Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: risk-scorer/target/risk-scorer-1.0.0.jar

      - name: Weryfikacja — health check
        run: |
          echo "Czekam na start Risk Scorera..."
          for i in {1..12}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" ${{ env.AZURE_WEBAPP_URL }}/api/health)
            if [ "$STATUS" = "200" ]; then
              echo "Risk Scorer działa pod adresem: ${{ env.AZURE_WEBAPP_URL }}"
              exit 0
            fi
            echo "Próba $i — status: $STATUS, czekam 10s..."
            sleep 10
          done
          echo "Risk Scorer nie odpowiada"
          exit 1
