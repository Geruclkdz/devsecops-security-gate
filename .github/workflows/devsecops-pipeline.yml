name: DevSecOps Security Gate Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

env:
  RISK_THRESHOLD: 20
  AZURE_WEBAPP_URL: https://risk-scorer-gg.azurewebsites.net

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Build — kompilacja demo-app
  # ─────────────────────────────────────────────
  build:
    name: Build Demo App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kodu
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Kompilacja demo-app
        run: mvn -f demo-app/pom.xml compile

      - name: Upload skompilowanych klas
        uses: actions/upload-artifact@v4
        with:
          name: demo-app-classes
          path: demo-app/target/

  # ─────────────────────────────────────────────
  # JOB 2: SAST — skanowanie Semgrep
  # ─────────────────────────────────────────────
  sast-scan:
    name: SAST Scan (Semgrep)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout kodu
        uses: actions/checkout@v4

      - name: Instalacja Semgrep
        run: pip install semgrep --break-system-packages -q

      - name: Uruchom Semgrep — reguły Java security
        run: |
          semgrep --config p/java --config p/owasp-top-ten \
            --json --output semgrep-results.json \
            demo-app/ || true

      - name: Upload raportu Semgrep
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep-results.json

  # ─────────────────────────────────────────────
  # JOB 3: Security Gate — Risk Scorer na Azure
  # ─────────────────────────────────────────────
  security-gate:
    name: Security Gate (Risk Scorer on Azure)
    runs-on: ubuntu-latest
    needs: sast-scan
    steps:
      - name: Pobierz raport Semgrep
        uses: actions/download-artifact@v4
        with:
          name: semgrep-report

      - name: Przekształć raport Semgrep do formatu Risk Scorera
        run: |
          python3 - <<'EOF'
          import json

          with open("semgrep-results.json") as f:
              semgrep = json.load(f)

          findings = []
          for result in semgrep.get("results", []):
              extra = result.get("extra", {})
              severity = extra.get("severity", "WARNING").upper()
              findings.append({
                  "check_id": result.get("check_id", "unknown"),
                  "severity": severity,
                  "message": extra.get("message", ""),
                  "path": result.get("path", "")
              })

          payload = {
              "findings": findings,
              "threshold": ${{ env.RISK_THRESHOLD }}
          }

          with open("scorer-input.json", "w") as f:
              json.dump(payload, f, indent=2)

          print(f"Znalezisk do oceny: {len(findings)}")
          EOF

      - name: Wywołaj Risk Scorer na Azure — oceń ryzyko
        id: risk_assessment
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST ${{ env.AZURE_WEBAPP_URL }}/api/assess \
            -H "Content-Type: application/json" \
            -d @scorer-input.json)

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          echo "=== Risk Scorer Response (Azure) ==="
          echo "$BODY" | python3 -m json.tool
          echo "HTTP Status: $HTTP_CODE"

          DECISION=$(echo "$BODY" | python3 -c "import sys,json; print(json.load(sys.stdin)['decision'])")
          SCORE=$(echo "$BODY" | python3 -c "import sys,json; print(json.load(sys.stdin)['score'])")

          echo "decision=$DECISION" >> $GITHUB_OUTPUT
          echo "score=$SCORE" >> $GITHUB_OUTPUT

          if [ "$DECISION" = "BLOCK" ]; then
            echo "::error::SECURITY GATE BLOCKED — Risk Score: $SCORE >= threshold ${{ env.RISK_THRESHOLD }}"
            exit 1
          fi

      - name: Podsumowanie w GitHub Summary
        if: always()
        run: |
          echo "## Security Gate Report" >> $GITHUB_STEP_SUMMARY
          echo "| Metryka | Wartość |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| Risk Score | ${{ steps.risk_assessment.outputs.score }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Próg blokady | ${{ env.RISK_THRESHOLD }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Decyzja | ${{ steps.risk_assessment.outputs.decision }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Risk Scorer URL | ${{ env.AZURE_WEBAPP_URL }} |" >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────────
  # JOB 4: Deploy — tylko jeśli gate przepuścił
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: security-gate
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    steps:
      - name: Deploy zatwierdzony
        run: |
          echo "Security Gate PASSED — aplikacja zatwierdzona do wdrożenia."
          echo "Risk Scorer działa pod adresem: ${{ env.AZURE_WEBAPP_URL }}"
